name: Competition self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public test dependencies
        run: |
          python -m pip install -r competition/requirements.txt
          python -m pip install -e .
      - name: Run public PDF acceptance
        run: make -C competition test-pdf
