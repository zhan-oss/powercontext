name: Competition self-test

on:
  push:
    branches: [codex/competition-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oceanbase/powercontext
          ref: 2026-competition
          path: public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public test dependencies
        run: |
          python -m venv public/competition/.venv
          public/competition/.venv/bin/pip install -r public/competition/requirements.txt
      - name: Run public acceptance tests
        run: make -C public/competition test-pdf test-evidence test-hybrid test-count-trigger PRODUCT=$GITHUB_WORKSPACE
