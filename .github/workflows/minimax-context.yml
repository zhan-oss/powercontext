name: MiniMax SDD context

on:
  push:
    branches: [2026-competition-ecosystem]
    paths: ["minimax/**", ".github/workflows/minimax-context.yml"]
  workflow_dispatch:

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documented dependencies
        run: python -m pip install 'powercontext[builtin]==1.2.0' 'pylibseekdb==1.4.0.post2' 'PyMySQL>=1.1,<2'
      - name: Query seekdb and resume PowerContext
        run: |
          python minimax/context_cli.py import --data minimax/.run --task shipping-vip > minimax/.run-import.json
          python minimax/context_cli.py context --data minimax/.run --task shipping-vip > minimax/.run-before.json
          python minimax/context_cli.py record --data minimax/.run --task shipping-vip --done 'specification and tests imported' --next 'modify shipping code' --verification 'baseline target test fails; regressions pass' > minimax/.run-record.json
          python minimax/context_cli.py context --data minimax/.run --task shipping-vip > minimax/.run-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('minimax/.run-before.json').read_text())
          after = json.loads(Path('minimax/.run-after.json').read_text())
          assert [item['path'] for item in before['sources']] == [
              'specs/shipping.md', 'shipping.py', 'test_shipping.py'
          ]
          assert before['previous_state'] == []
          assert any('specification and tests imported' in state for state in after['previous_state'])
          print('seekdb sources and PowerContext restart: passed')
          PY
      - name: Check functional baseline and specification refresh
        run: |
          python - <<'PY'
          import subprocess
          import sys
          result = subprocess.run([sys.executable, '-m', 'unittest', '-v', 'test_shipping'],
                                  cwd='minimax/project', capture_output=True, text=True)
          print(result.stderr)
          assert result.returncode == 1
          assert 'FAIL: test_vip_threshold' in result.stderr
          assert 'test_regular_threshold' in result.stderr
          assert 'test_negative_subtotal' in result.stderr
          print('baseline target behavior: failed as expected')
          PY
          python - <<'PY'
          from pathlib import Path
          path = Path('minimax/project/specs/shipping.md')
          path.write_text(path.read_text().replace('8,000 cents', '8,500 cents'))
          PY
          python minimax/context_cli.py import --data minimax/.run --task shipping-vip > minimax/.run-import-updated.json
          python minimax/context_cli.py context --data minimax/.run --task shipping-vip > minimax/.run-updated.json
          python - <<'PY'
          import json
          from pathlib import Path
          original = json.loads(Path('minimax/.run-before.json').read_text())
          updated = json.loads(Path('minimax/.run-updated.json').read_text())
          old_spec = next(item for item in original['sources'] if item['kind'] == 'spec')
          new_spec = next(item for item in updated['sources'] if item['kind'] == 'spec')
          assert '8,500 cents' in new_spec['content']
          assert old_spec['sha256'] != new_spec['sha256']
          print('specification reimport and refreshed query: passed')
          PY

